<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="savGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102C57" />
      <stop offset="100%" stop-color="#091A36" />
    </linearGradient>
    <filter id="needleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dark Navy rounded icon frame -->
  <rect width="128" height="128" rx="28" fill="url(#savGradient)" />

  <!-- Subtle compass degree rings -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2.5" stroke-dasharray="4 4" />
  <circle cx="64" cy="64" r="35" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Cardinal points -->
  <line x1="64" y1="21" x2="64" y2="28" stroke="#EA5C2B" stroke-width="3.5" stroke-linecap="round" />
  <line x1="64" y1="100" x2="64" y2="107" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" />
  <line x1="21" y1="64" x2="28" y2="64" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" />
  <line x1="100" y1="64" x2="107" y2="64" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round" />

  <!-- Compass Star Needle pointing toward North-East (Aspiration & Global Direction) -->
  <g filter="url(#needleShadow)">
    <!-- North Arrow - Coral Accent -->
    <polygon points="64,64 72,59 90,30 68,48" fill="#EA5C2B" />
    <polygon points="64,64 68,48 90,30 59,72" fill="#FF7745" />

    <!-- South Arrow - Pure White -->
    <polygon points="64,64 59,72 38,98 60,78" fill="#CBD5E1" />
    <polygon points="64,64 60,78 38,98 72,59" fill="#FFFFFF" />
  </g>

  <!-- Center Core Pin -->
  <circle cx="64" cy="64" r="6" fill="#102C57" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="64" cy="64" r="2" fill="#EA5C2B" />
</svg>
